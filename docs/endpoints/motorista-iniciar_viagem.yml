---
tags:
  - Motorista
summary: Iniciar Viagem
description: |
  Marca uma viagem como **iniciada**.
  Disponível apenas para usuários com o papel **motorista**.
  Requer um **JWT token** válido no cabeçalho `Authorization`.
  O motorista não pode ter outra viagem em andamento nem descanso obrigatório pendente,
  e precisa estar no dia e no horário de trabalho. Com a viagem em andamento, ele aparece como `EM_ROTA`.
operationId: iniciarViagem
security:
  - BearerAuth: []
parameters:
  - in: header
    name: Authorization
    required: true
    type: string
    description: JWT token para autenticação.
    example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...ExAMPLE_TOKEN"
  - in: path
    name: viagem_id
    required: true
    type: integer
    description: ID da viagem a ser iniciada.
    example: 12
responses:
  200:
    description: Viagem iniciada com sucesso.
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Viagem iniciada com sucesso."
  409:
    description: Motorista já está `EM_ROTA` em outra viagem.
  403:
    description: |
      Acesso negado — viagem de outro motorista, fora do dia/horário de trabalho, ou
      descanso obrigatório pendente (a mensagem informa o horário em que pode voltar a dirigir).
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Access restricted to motoristas"
  404:
    description: Viagem não encontrada.
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Viagem not found"
  401:
    description: Token ausente ou inválido.
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Missing Authorization Header"
