# Alembic Configuration
# See: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
script_location = migrations
prepend_sys_path = .

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate revision IDs for readability
truncate_slug_length = 40

# Only use revision directives when using --autogenerate
revision_environment = false

# Max length of characters to apply to the "slug" field
# Omit to disable truncation
# max_slug_length = 40

# Timezone to use when rendering the date
# within the migration file as well as the filename
timezone = UTC

# Set to 'true' for Alembic to skip the empty migrations
# skip_if_no_changes = true

# SQLAlchemy URL - loaded from env.py using app config
# sqlalchemy.url is set dynamically in env.py

[post_write_hooks]
# Hooks for formatting migrations after creation
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
