# Compose project is named explicitly. Without it, Compose derives the project
# from the directory name ("infra"), which is identical in municipal-backend --
# so `make db-up` here would recreate that product's container and bind this
# app to its data volume. Distinct name, container, volume and ports keep the
# two products' databases isolated and runnable side by side.
name: mebuska-corporate

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mebuska_corporate_db
    restart: always
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    volumes:
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mebuska_corporate_data:/var/lib/postgresql/data

  # Contadores do rate limit, compartilhados entre os workers (RATELIMIT_STORAGE_URI).
  redis:
    image: redis:8.6-alpine
    container_name: mebuska_corporate_redis
    restart: always
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: mebuska_corporate_mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1026}:1025"
      - "${MAILHOG_UI_PORT:-8026}:8025"

volumes:
  mebuska_corporate_data:
