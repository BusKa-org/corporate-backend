[project]
name = "mebuska-corporate"
version = "0.1.0"
description = "Backend API for MeBusKá - On-demand Corporate Transport"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flasgger>=0.9.7.1",
    "flask>=3.1.2",
    "flask-cors>=6.0.1",
    "flask-jwt-extended>=4.7.1",
    "flask-restx>=1.3.0",
    "flask-sqlalchemy>=3.1.1",
    "geoalchemy2>=0.18.0",
    "marshmallow>=3.20.1",
    "gunicorn>=23.0.0",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "python-json-logger>=2.0.7",
    "sqlalchemy>=2.0.44",
    "alembic>=1.13.0",
    "flask-apscheduler>=1.13.1",
    "firebase-admin>=7.2.0",
    "requests>=2.33.0",
    # All transitive, pinned directly to clear 113 known advisories
    # pip-audit found on the unrefreshed lock (none in app/ code — bandit
    # is clean). Chains: firebase-admin -> google-auth/pyjwt[crypto]
    # (cryptography, pyasn1), firebase-admin -> httpx (anyio, h2, hpack),
    # firebase-admin -> cachecontrol/requests (urllib3, idna, msgpack),
    # flasgger -> flask/jsonschema (werkzeug, click, mistune),
    # alembic -> mako.
    "pyjwt>=2.15.1",
    "cryptography>=50.0.0",
    "pyasn1>=0.6.4",
    "anyio>=4.14.2",
    "h2>=4.4.1",
    "hpack>=4.2.0",
    "urllib3>=2.8.0",
    "idna>=3.15",
    "msgpack>=1.2.1",
    "werkzeug>=3.1.9",
    "click>=8.3.3",
    "mistune>=3.3.0",
    "mako>=1.3.12",
]

# ==========================================
# Tool Configurations
# ==========================================

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
    \.git
    | \.venv
    | migrations
    | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by black)
    "B904",   # raise-without-from-inside-except (intentional: converting to user-friendly errors)
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
warn_return_any = false  # Too noisy with SQLAlchemy queries
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = false  # Don't enforce types in untyped functions
exclude = ["migrations", ".venv"]

# Ignore Flask-SQLAlchemy model issues (needs proper stubs)
[[tool.mypy.overrides]]
module = "app.models.*"
ignore_errors = true

# Services - relaxed but still useful checking
[[tool.mypy.overrides]]
module = "app.services.*"
warn_return_any = false
check_untyped_defs = false

# Stricter checking on core and new code
[[tool.mypy.overrides]]
module = "app.core.*"
warn_return_any = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.api.controllers.*"
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -v --tb=short --strict-markers --cov=app --cov-report=term-missing --cov-report=html --cov-branch"
markers = [
  "unit: fast tests without DB",
  "integration: API/DB integration tests",
  "e2e: full flows, slowest",
]
filterwarnings = [
  "ignore:pythonjsonlogger\\.jsonlogger has been moved:DeprecationWarning",
]

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "faker>=26.0.0",
    "factory-boy>=3.3.0",
    "requests>=2.33.0",
    "pytest-xdist>=3.6.0",
    "black>=26.3.1",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "bandit>=1.9.4",
    "pip-audit>=2.7.0",
    "types-requests>=2.33.0.20260408",
    # Transitive via pre-commit/bandit, pinned for the same reason as above.
    "virtualenv>=21.14.5",
    "pygments>=2.20.0",
    "pip>=26.2.0",
]

[tool.setuptools]
packages = ["app"]
