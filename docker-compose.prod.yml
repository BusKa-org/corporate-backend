# As variáveis abaixo precisam estar listadas aqui para chegarem ao container.
# O --env-file do docker-compose só alimenta a interpolação ${VAR} deste
# arquivo; ele não injeta nada no processo. FLASK_ENV faltava, o que deixava
# app.debug=True em produção e desligava todos os jobs de background.
x-app-env: &app_env
  DB_HOST: db
  DB_PORT: 5432
  DB_USER: ${DB_USER:-buska_user}
  DB_PASSWORD: ${DB_PASSWORD:-buska_pass}
  DB_NAME: ${DB_NAME:-buska_db}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
  JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-2}
  FLASK_ENV: ${FLASK_ENV:-production}
  TZ: ${TIMEZONE:-America/Sao_Paulo}
  TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
  ROTA_BUFFER_MINUTOS_PADRAO: ${ROTA_BUFFER_MINUTOS_PADRAO:-5}
  ROTA_BUFFER_MINUTOS_MAX: ${ROTA_BUFFER_MINUTOS_MAX:-30}
  ROTA_PRAZO_INICIO_MINUTOS_PADRAO: ${ROTA_PRAZO_INICIO_MINUTOS_PADRAO:-10}
  ROTA_PRAZO_INICIO_MINUTOS_MAX: ${ROTA_PRAZO_INICIO_MINUTOS_MAX:-120}
  FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  FRONTEND_URL: ${FRONTEND_URL:-}
  APP_DOWNLOAD_URL: ${APP_DOWNLOAD_URL:-}
  MAIL_SERVER: ${MAIL_SERVER:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
  JOB_BUFFER_INTERVALO_SEGUNDOS: ${JOB_BUFFER_INTERVALO_SEGUNDOS:-30}
  JOB_PRAZO_INICIO_INTERVALO_SEGUNDOS: ${JOB_PRAZO_INICIO_INTERVALO_SEGUNDOS:-60}
  MOTORISTA_HORAS_MAX_DIRECAO: ${MOTORISTA_HORAS_MAX_DIRECAO:-4}
  MOTORISTA_DESCANSO_MINUTOS: ${MOTORISTA_DESCANSO_MINUTOS:-30}
  # Vazio = /app/instance/fotos_aluno, que é onde o volume fotos_aluno está montado.
  FOTOS_ALUNO_DIR: ${FOTOS_ALUNO_DIR:-}
  FOTO_ALUNO_MAX_BYTES: ${FOTO_ALUNO_MAX_BYTES:-5242880}
  FOTO_ALUNO_MAX_PIXELS: ${FOTO_ALUNO_MAX_PIXELS:-25000000}
  QR_PASSO_SEGUNDOS: ${QR_PASSO_SEGUNDOS:-30}
  QR_DIGITOS: ${QR_DIGITOS:-6}
  QR_JANELA_PASSOS: ${QR_JANELA_PASSOS:-1}
  SYNC_TOLERANCIA_SEGUNDOS: ${SYNC_TOLERANCIA_SEGUNDOS:-120}

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: buska_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-buska_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-buska_pass}
      POSTGRES_DB: ${DB_NAME:-buska_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - buska_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-buska_user} -d ${DB_NAME:-buska_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE}
    pull_policy: never
    container_name: buska_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      <<: *app_env
      # São 4 workers do gunicorn. Se cada um subisse o próprio scheduler, as
      # notificações sairiam quadruplicadas.
      RUN_SCHEDULER: "false"
    volumes:
      # Fotos dos alunos (FOTOS_ALUNO_DIR vazio = /app/instance/fotos_aluno).
      - fotos_aluno:/app/instance/fotos_aluno
    depends_on:
      db:
        condition: service_healthy
    networks:
      - buska_network

  # Processo único e dedicado para os jobs de background, separado da API para
  # que "o scheduler está de pé?" seja respondível com um docker ps.
  scheduler:
    image: ${API_IMAGE}
    pull_policy: never
    container_name: buska_scheduler
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler_main"]
    environment:
      <<: *app_env
      RUN_SCHEDULER: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - buska_network

volumes:
  postgres_data:
    driver: local
  fotos_aluno:
    driver: local

networks:
  buska_network:
    driver: bridge
